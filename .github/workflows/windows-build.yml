name: M3U8 Studio - Windows x64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Analyze, Test, Build Windows and Setup EXE
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop and generate native runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=m3u8_studio --no-pub .

      - name: Download Dart and Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Windows x64 executable
        run: flutter build windows --release

      - name: Build one-click Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $compiler = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            $installed = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($installed) { $compiler = $installed.Source }
          }
          if (-not $compiler) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          & $compiler 'm3u8-studio-setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'build/installer/M3U8-Studio-Setup-x64.exe')) {
            throw 'Installer EXE was not generated.'
          }

      - name: Upload one-click installer
        uses: actions/upload-artifact@v4
        with:
          name: M3U8-Studio-One-Click-Installer-x64
          path: build/installer/M3U8-Studio-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package full release directory
        shell: pwsh
        run: |
          $releasePath = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releasePath)) {
            throw "Expected Windows build directory does not exist: $releasePath"
          }
          Compress-Archive -Path "$releasePath/*" -DestinationPath 'M3U8-Studio-Windows-x64.zip' -Force

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: M3U8-Studio-Windows-x64
          path: M3U8-Studio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
